[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "nr-ran-sim"
version = "0.1.0"
description = "Reproducible 5G NR RAN system-level simulator with traceable scheduler studies"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Abdelrahman Elsayed" }]
license = "MIT"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Telecommunications Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=2.4.2,<2.5",
  "pint>=0.25.3,<0.26",
  "pydantic>=2.13.4,<3",
  "PyYAML>=6.0.3,<7",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.9.4,<2",
  "hypothesis>=6.138,<7",
  "mypy>=2.3,<3",
  "pip-audit>=2.10.1,<3",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.0,<8",
  "ruff>=0.16.3,<0.17",
  "types-PyYAML>=6.0.12.20250915",
]

[project.scripts]
nr-ran-sim = "nr_ran_sim.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nr_ran_sim"]

[tool.hatch.build.targets.sdist]
only-include = [
  "src",
  "tests",
  "tools",
  "benchmarks",
  "schemas",
  "examples",
  "docs",
  "README.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "uv.lock",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PIE", "PT", "RUF", "S", "SIM", "TRY", "UP"]
ignore = ["S101", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["src"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=nr_ran_sim",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=90",
]
testpaths = ["tests"]
markers = [
  "performance: reproducible runtime and Python-managed memory guardrails",
  "property: deterministic property-based and metamorphic verification",
  "reference: independent analytical or pinned-table verification",
  "regression: approved semantic scenario baselines",
]

[tool.coverage.run]
branch = true
source = ["nr_ran_sim"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise AssertionError",
  "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["tests"]
skips = []
