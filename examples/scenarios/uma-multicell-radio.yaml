schema_version: "1.0"
scenario_id: uma-multicell-radio
description: Static three-cell UMa scene for propagation, association, and interference inspection

simulation:
  warmup: {value: 10, unit: ms}
  measurement: {value: 100, unit: ms}
  drain: {value: 20, unit: ms}

radio:
  direction: downlink
  frequency_range: FR1
  carrier_frequency: {value: 3.5, unit: GHz}
  channel_bandwidth: {value: 100, unit: MHz}
  subcarrier_spacing: {value: 30, unit: kHz}
  cyclic_prefix: normal
  layers: 1
  cqi_table: table1
  mcs_table: table1
  target_bler: 0.1
  implementation_margin: {value: 3, unit: dB}
  data_re_overhead_fraction: 0.14

models:
  fidelity_profile: tier-a-fr1-static-v1
  propagation: 3gpp-tr38901-r18-v18.1.0
  los_state: probability_static
  shadowing: independent_static
  interference: full_buffer_reuse1-v1
  link_adaptation: analytical-awgn-gap-v1

topology:
  scenario: uma
  coordinate_system: local-cartesian
  cells:
    cell-a:
      position:
        x: {value: -250, unit: m}
        y: {value: 0, unit: m}
        z: {value: 25, unit: m}
      transmit_power: {value: 46, unit: dBm}
      antenna_gain: {value: 15, unit: dBi}
      miscellaneous_loss: {value: 2, unit: dB}
    cell-b:
      position:
        x: {value: 250, unit: m}
        y: {value: 0, unit: m}
        z: {value: 25, unit: m}
      transmit_power: {value: 46, unit: dBm}
      antenna_gain: {value: 15, unit: dBi}
      miscellaneous_loss: {value: 2, unit: dB}
    cell-c:
      position:
        x: {value: 0, unit: m}
        y: {value: 433, unit: m}
        z: {value: 25, unit: m}
      transmit_power: {value: 46, unit: dBm}
      antenna_gain: {value: 15, unit: dBi}
      miscellaneous_loss: {value: 2, unit: dB}
  ue_groups:
    users:
      count: 12
      placement:
        mode: uniform_rectangle
        x_min: {value: -400, unit: m}
        x_max: {value: 400, unit: m}
        y_min: {value: -200, unit: m}
        y_max: {value: 550, unit: m}
        height: {value: 1.5, unit: m}
        minimum_2d_distance: {value: 35, unit: m}
        attempt_budget: 10000
      receiver_noise_figure: {value: 7, unit: dB}
      antenna_gain: {value: 0, unit: dBi}
      penetration_loss: {value: 0, unit: dB}
      bearers: [broadband]

traffic_profiles:
  broadband:
    source:
      type: poisson
      mean_interarrival: {value: 2, unit: ms}
    packet_size:
      type: constant
      payload: {value: 12000, unit: bit}
    queue:
      max_packets: 1000
      max_payload: {value: 12, unit: Mbit}
    deadline: null

scheduler:
  policy: proportional-fair
  parameters:
    averaging_alpha: 0.01
    initial_rate_floor: {value: 1, unit: kbit/s}
