schema_version: "1.0"
scenario_id: scheduler-qos-smoke
description: Aligned two-UE scenario for scheduler, queue-service, and KPI inspection

simulation:
  warmup: {value: 1, unit: ms}
  measurement: {value: 4, unit: ms}
  drain: {value: 1, unit: ms}

radio:
  direction: downlink
  frequency_range: FR1
  carrier_frequency: {value: 3.5, unit: GHz}
  channel_bandwidth: {value: 100, unit: MHz}
  subcarrier_spacing: {value: 30, unit: kHz}
  cyclic_prefix: normal
  layers: 1
  cqi_table: table1
  mcs_table: table1
  target_bler: 0.1
  implementation_margin: {value: 3, unit: dB}
  data_re_overhead_fraction: 0.14

models:
  fidelity_profile: tier-a-fr1-static-v1
  propagation: 3gpp-tr38901-r18-v18.1.0
  los_state: explicit
  shadowing: "off"
  interference: noise_limited-v1
  link_adaptation: analytical-awgn-gap-v1

topology:
  scenario: uma
  coordinate_system: local-cartesian
  cells:
    cell-a:
      position:
        x: {value: 0, unit: m}
        y: {value: 0, unit: m}
        z: {value: 25, unit: m}
      transmit_power: {value: 46, unit: dBm}
      antenna_gain: {value: 0, unit: dBi}
      miscellaneous_loss: {value: 0, unit: dB}
  ue_groups:
    users:
      count: 2
      explicit_link_states:
        cell-a: [los, los]
      placement:
        mode: explicit
        positions:
          - x: {value: 100, unit: m}
            y: {value: 0, unit: m}
            z: {value: 1.5, unit: m}
          - x: {value: 400, unit: m}
            y: {value: 0, unit: m}
            z: {value: 1.5, unit: m}
        minimum_2d_distance: {value: 10, unit: m}
      receiver_noise_figure: {value: 7, unit: dB}
      antenna_gain: {value: 0, unit: dBi}
      penetration_loss: {value: 0, unit: dB}
      bearers: [broadband]

traffic_profiles:
  broadband:
    source:
      type: periodic
      interval: {value: 0.5, unit: ms}
      initial_offset: {value: 0, unit: ms}
    packet_size:
      type: constant
      payload: {value: 250, unit: kbit}
    queue:
      max_packets: 100
    deadline: null

scheduler:
  policy: proportional-fair
  parameters:
    averaging_alpha: 0.5
    initial_rate_floor: {value: 1, unit: kbit/s}

extensions: {}
