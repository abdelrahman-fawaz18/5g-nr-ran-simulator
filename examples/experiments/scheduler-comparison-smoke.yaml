schema_version: "1.0"
experiment_id: scheduler-comparison-smoke
description: Small paired-seed scheduler study for end-to-end experiment-framework verification
profile: smoke
base_scenario: ../scenarios/uma-multicell-radio.yaml
timing: inherit-from-scenario

scheduler_set:
  - level_id: round-robin
    scheduler:
      policy: round-robin
      parameters: {}
  - level_id: max-ci
    scheduler:
      policy: max-ci
      parameters: {}
  - level_id: proportional-fair
    scheduler:
      policy: proportional-fair
      parameters:
        averaging_alpha: 0.01
        initial_rate_floor: {value: 1, unit: kbit/s}

sweep_factors: []

seed_plan:
  master_seed: "0x88888888888888888888888888888888"
  replication_ids: [0, 1, 2]
  pairing: common-random-numbers-v1

analysis:
  confidence_level: 0.95
  interval_method: percentile-bootstrap-v1
  bootstrap_resamples: 500
  comparison_reference_scheduler: proportional-fair
  metrics:
    - {name: cohort_goodput_bps, aggregation_level: system, aggregation_id: system}
    - {name: system_delay_p95_ns, aggregation_level: system, aggregation_id: system}
    - {name: jain_fairness, aggregation_level: system, aggregation_id: system}
    - {name: prb_utilization, aggregation_level: system, aggregation_id: system}

execution:
  max_workers: 2
  failure_policy: fail-experiment

output:
  artifact_schema_version: "1.0"
  metric_dataset_schema_version: "1.0"
  summary_dataset_schema_version: "1.0"
  plot_manifest_schema_version: "1.0"
