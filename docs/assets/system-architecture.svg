<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc" data-design-system="systems-lab-v1" data-layout="figure">
<title id="title">System architecture</title>
<desc id="desc">Validated scenarios flow through an isolated deterministic simulation and evidence pipeline.</desc>
<defs>
<pattern id="engineering-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#dce2e8" stroke-width="1"/></pattern>
</defs>
