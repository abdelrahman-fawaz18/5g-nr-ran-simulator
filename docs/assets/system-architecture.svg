<text x="421" y="272" text-anchor="middle" font-family="Arial Narrow,Arial,Segoe UI,sans-serif" font-size="15" font-weight="800" letter-spacing="0" fill="#16865b">02</text>
<text x="458" y="273" text-anchor="start" font-family="Arial Narrow,Arial,Segoe UI,sans-serif" font-size="22" font-weight="700" letter-spacing="0" fill="#0b1b2b">Kernel</text>
<text x="402" y="321" text-anchor="start" font-family="Arial Narrow,Arial,Segoe UI,sans-serif" font-size="17" font-weight="500" letter-spacing="0" fill="#5f6f80">Integer time</text>
