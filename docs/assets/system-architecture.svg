<text x="70" y="72" text-anchor="start" font-family="Arial Narrow,Arial,Segoe UI,sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#2457d6">FIG 02 / SYSTEM ARCHITECTURE</text>
<text x="70" y="126" text-anchor="start" font-family="Arial Narrow,Arial,Segoe UI,sans-serif" font-size="38" font-weight="750" letter-spacing="0" fill="#0b1b2b">From scenario definition to verifiable RAN evidence</text>
<text x="70" y="164" text-anchor="start" font-family="Arial Narrow,Arial,Segoe UI,sans-serif" font-size="21" font-weight="500" letter-spacing="0" fill="#5f6f80">Each boundary is typed, deterministic and independently testable.</text>
