<text x="111" y="272" text-anchor="middle" font-family="Arial Narrow,Arial,Segoe UI,sans-serif" font-size="15" font-weight="800" letter-spacing="0" fill="#2457d6">01</text>
<text x="148" y="273" text-anchor="start" font-family="Arial Narrow,Arial,Segoe UI,sans-serif" font-size="22" font-weight="700" letter-spacing="0" fill="#0b1b2b">Scenario</text>
<text x="92" y="321" text-anchor="start" font-family="Arial Narrow,Arial,Segoe UI,sans-serif" font-size="17" font-weight="500" letter-spacing="0" fill="#5f6f80">Typed YAML/JSON</text>
<text x="92" y="349" text-anchor="start" font-family="Arial Narrow,Arial,Segoe UI,sans-serif" font-size="17" font-weight="500" letter-spacing="0" fill="#5f6f80">units + domains</text>
