<text x="1081" y="552" text-anchor="middle" font-family="Arial Narrow,Arial,Segoe UI,sans-serif" font-size="15" font-weight="800" letter-spacing="0" fill="#16865b">08</text>
<text x="1118" y="553" text-anchor="start" font-family="Arial Narrow,Arial,Segoe UI,sans-serif" font-size="22" font-weight="700" letter-spacing="0" fill="#0b1b2b">Evidence</text>
