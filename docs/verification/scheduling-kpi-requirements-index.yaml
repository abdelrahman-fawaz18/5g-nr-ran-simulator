schema_version: "1.0"
capability: scheduling-service-and-kpis
evidence_level: E1-implemented-and-analytically-tested
scope_note: >-
  Deterministic Tier A RR, Max-C/I, PF, queue-service, and KPI behavior is implemented and tested
  under a static analytical radio profile. This is not receiver-calibrated throughput, BLER/HARQ,
  load-coupled interference, or multi-replication statistical evidence.

