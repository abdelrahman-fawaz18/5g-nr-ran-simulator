schema_version: "1.0"
capability: nr-resource-grid-and-capacity
evidence_level: mixed-E1-E2
scope_note: >-
  Release 18 resource/CQI/MCS/TBS tables and integer procedures are E2 reference-verified in the
  supported one-layer static domain. The SINR threshold is an E1 project-derived analytical
  abstraction and is not measurement-calibrated. Scheduling, observed throughput, BLER sampling,
  and HARQ remain out of scope.

